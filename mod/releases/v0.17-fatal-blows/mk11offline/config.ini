# MK11 offline Krypt settings (sdmc:/mk11offline/config.ini)
#
# Tops Koins, Souls and Hearts up to this amount each time the Krypt starts (0 = off).
krypt_currency_topup=0
#
# Grant gear and augment rewards from Krypt chests locally (1 = on). Rewards are always also
# recorded in inventory_batches.jsonl.
apply_gear_rewards=1
#
# Skip the studio credits after a tower's character ending (1 = skip, the default; 0 = play them).
skip_tower_credits=1
#
# Store (ZR) with the offline catalogue, priced in Time Krystals (1 = on, the default; 0 = off).
offline_store=1
#
# Time Krystals given for each Krypt chest opened (0 = off).
krypt_chest_krystals=10
#
# Daily Challenges in the Kombat Kard (ZL): three a day, paid in Koins (1 = on, the default; 0 = off).
daily_challenges=1
#
# Player 1 is played by the CPU (AI fighter) in local fights (0 = off, the default).
p1_cpu=0
#
# Spending never lowers Koins, Souls, Hearts or Time Krystals (1 = on; 0 = off, the default).
free_currency=0
#
# Spending never lowers crafting materials, Kollector relics, Tower Keys or Konsumables
# (1 = on; 0 = off, the default).
free_items=0
#
# Routine log lines (wallet, saves, server replies) in log.txt (1 = on; 0 = off, the default).
verbose_log=0
#
# Cyrax and Sektor raise their fist after a won match, as after a Brutality (1 = on, the default; 0 = off).
victory_pose=1
#
# Cyrax and Sektor have a Fatal Blow (ZL+ZR at low life): Cyrax's amplified Bomb Smash, Sektor's Teleport
# Attack, with Fatal Blow damage (1 = on, the default; 0 = off).
fatal_blows=1
